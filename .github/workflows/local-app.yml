name: Local app checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests
      - run: python -m pip install playwright==1.56.0
      - name: Use the runner's installed Google Chrome
        run: test -x /usr/bin/google-chrome
      - run: python tests/browser_check_local.py
        env:
          INVENTION_TEST_BROWSER: /usr/bin/google-chrome
