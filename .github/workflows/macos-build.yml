name: Build Mac prototype download
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local_app/**'
      - 'packaging/**'
      - 'skills/inventor-brief-v2/**'
      - '.github/workflows/macos-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$(uname -m)" = arm64
      - run: python -m unittest discover -s tests
      - run: python -m pip install pyinstaller==6.16.0
      - run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Invention-Disclosure-Generator-arm64-UNNOTARIZED-PROTOTYPE
          path: |
            dist/*.dmg
            dist/*.sha256
